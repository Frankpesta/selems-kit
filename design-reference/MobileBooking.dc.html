<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone date picker — Selems Hotel</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="site.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&amp;family=Instrument+Sans:wght@400..700&amp;display=swap">
<style>body{margin:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 0}
.d{height:44px;border:0;background:transparent;font:inherit;font-size:15px;color:#17222D;cursor:pointer;font-variant-numeric:tabular-nums}
.d.past{color:#A9B3B8;cursor:default}
.d.blank{visibility:hidden}
.d.mid{background:#F4E6D9}
.d.end{background:#A4561B;color:#fff;font-weight:700;border-radius:4px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F4F2; color: #17222D; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #DCE1E1">
<a href="MobileRoom.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #17222D"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<div><p style="margin: 0; font-weight: 600">Choose your dates</p><p class="small muted" style="margin: 0">VIP Suite · step 1 of 4</p></div>
</header>
<div style="padding: 16px 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; background: #fff">
<div style="border-bottom: 2px solid #A4561B; padding-bottom: 8px"><p class="eyebrow" style="font-size: 11px">Check-in</p><p class="num" style="margin: 0; font-weight: 600">{{inLabel}}</p></div>
<div style="border-bottom: 2px solid #DCE1E1; padding-bottom: 8px"><p class="eyebrow" style="font-size: 11px">Check-out</p><p class="num" style="margin: 0; font-weight: 600">{{outLabel}}</p></div>
</div>
<div style="padding: 20px 16px; flex: 1; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center"><h1 class="disp" style="font-size: 26px">October 2026</h1><span class="small muted">Tap arrival, then departure</span></div>
<div class="cal small muted" aria-hidden="true" style="text-align: center"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
<div class="cal">
<sc-for list="{{days}}" as="day" hint-placeholder-count="35">
<button class="{{day.cls}}" onClick="{{day.pick}}" aria-label="{{day.label}}">{{day.n}}</button>
</sc-for>
</div>
<p class="small muted" style="margin: 0">Prices may vary on weekends and during events. [Rates come from the admin panel.]</p>
</div>
<div style="background: #fff; border-top: 1px solid #DCE1E1; padding: 14px 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
<div><p class="num" style="margin: 0; font-weight: 700; font-size: 18px">{{total}}</p><p class="small muted" style="margin: 0">{{nightsLabel}}</p></div>
<a class="btn btn-amber" href="Booking.dc.html">Continue</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { a: 24, b: 26 }; }
  pick(n) {
    const { a, b } = this.state;
    if (n < 14) return;
    if (a && !b && n > a) this.setState({ b: n });
    else this.setState({ a: n, b: null });
  }
  renderVals() {
    const { a, b } = this.state;
    const wk = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const days = [];
    for (let i = 0; i < 3; i++) days.push({ n: '', cls: 'd blank', label: 'empty', pick: () => {} });
    for (let n = 1; n <= 31; n++) {
      let cls = 'd';
      if (n < 14) cls += ' past';
      else if (n === a || n === b) cls += ' end';
      else if (a && b && n > a && n < b) cls += ' mid';
      days.push({ n: String(n), cls, label: wk[(n + 2) % 7] + ' ' + n + ' October', pick: () => this.pick(n) });
    }
    const nights = a && b ? b - a : 0;
    const lab = (n) => n ? wk[(n + 2) % 7] + ' ' + n + ' Oct' : 'Select';
    return {
      days,
      inLabel: lab(a), outLabel: lab(b),
      total: nights ? '₦' + (nights * 70000).toLocaleString('en-NG') : '₦70,000 / night',
      nightsLabel: nights ? nights + (nights === 1 ? ' night' : ' nights') + ' · VIP Suite' : 'Choose a check-out date'
    };
  }
}
</script>
</body>
</html>
